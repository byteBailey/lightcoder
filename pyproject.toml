[project]
name = "lightcoder"
version = "0.1.0"
description = "A minimal, hackable coding agent and SWE-bench ablation/optimization testbed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "byteBailey", email = "cigj7970@gmail.com" }]
keywords = ["coding-agent", "llm", "swe-bench", "agent", "ablation"]

dependencies = [
    "openai>=1.0",
    # SOCKS support for httpx: without it a socks5:// all_proxy (common with Clash/V2Ray)
    # makes the OpenAI client fail at startup with "socksio is not installed".
    "httpx[socks]",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# SWE-bench evaluation harness (heavier; pulls datasets + the official harness).
eval = [
    "datasets>=2.16",
    "swebench>=3.0",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
lightcoder = "lightcoder.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lightcoder"]
